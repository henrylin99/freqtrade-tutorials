site_name: Freqtrade 实战教程
site_description: Freqtrade 量化交易中文实战教程（含英文版）— 从环境搭建到实盘的完整学习路径
site_url: https://henrylin99.github.io/freqtrade-tutorials/
repo_url: https://github.com/henrylin99/freqtrade-tutorials
repo_name: henrylin99/freqtrade-tutorials

copyright: © 2026 Freqtrade 实战教程 · 仅供学习交流，不构成投资建议

theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true

nav:
  - '🇨🇳 中文教程':
